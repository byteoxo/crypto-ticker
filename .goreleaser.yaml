version: 2

project_name: crypto-ticker

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/crypto-ticker
    env:
      - CGO_ENABLED=0
    # Embed IANA zoneinfo so tz = "Asia/Shanghai" works on Windows / minimal images.
    tags:
      - timetzdata
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
